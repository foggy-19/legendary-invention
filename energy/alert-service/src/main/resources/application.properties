spring.application.name=alert-service
# service port
server.port=8084
# mysql database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/energy-db
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
# kafka
spring.kafka.bootstrap-servers=localhost:9094
# kafka-consumer
spring.kafka.template.group-id=alert-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.panonit.kafka.event